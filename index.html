<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#f0f2f5; min-height:100vh; }
  .navbar { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; padding:18px 30px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .navbar h1 { font-size:22px; }
  .nav-links a { color:#fff; text-decoration:none; margin-left:15px; padding:8px 16px; border-radius:6px; font-size:14px; }
  .nav-links a:hover, .nav-links a.active { background:rgba(255,255,255,0.2); }
  .container { padding:30px; max-width:1400px; margin:0 auto; }
  h2 { color:#333; margin-bottom:20px; }
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px; margin-bottom:30px; }
  .stat-card { background:#fff; padding:25px; border-radius:14px; box-shadow:0 4px 15px rgba(0,0,0,0.08); border-left:5px solid #667eea; position:relative; transition:.3s; }
  .stat-card:hover { transform:translateY(-5px); }
  .stat-card.green { border-left-color:#28a745; }
  .stat-card.red { border-left-color:#dc3545; }
  .stat-card.orange { border-left-color:#fd7e14; }
  .stat-card.blue { border-left-color:#007bff; }
  .stat-label { color:#777; font-size:13px; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .stat-value { font-size:26px; font-weight:700; color:#222; }
  .stat-icon { position:absolute; right:15px; top:15px; font-size:36px; opacity:0.15; }
  .loading { text-align:center; padding:40px; color:#666; }
  .refresh-btn { background:#667eea; color:#fff; border:none; padding:10px 22px; border-radius:8px; cursor:pointer; font-size:14px; margin-bottom:20px; font-weight:600; }
  .refresh-btn:hover { background:#5568d3; }
  .history-section { background:#fff; border-radius:14px; padding:25px; box-shadow:0 4px 15px rgba(0,0,0,0.08); margin-bottom:25px; overflow-x:auto; }
  .history-section h3 { color:#444; margin-bottom:15px; border-bottom:2px solid #f0f2f5; padding-bottom:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:#f8f9fa; color:#555; padding:10px; text-align:left; font-weight:600; }
  td { padding:10px; border-bottom:1px solid #eee; color:#444; }
  tr:hover td { background:#f8f9ff; }
  .empty { text-align:center; color:#999; padding:20px; }
  @media(max-width:600px){ .navbar{flex-direction:column;} .nav-links a{margin:0 5px;padding:6px 10px;font-size:13px;} .container{padding:15px;} }
</style>
</head>
<body>
<div class="navbar">
  <h1>📊 Business Dashboard</h1>
  <div class="nav-links">
    <a href="#" class="active">Dashboard</a>
    <a href="sales.html">Sales</a>
    <a href="purchases.html">Purchases</a>
  </div>
</div>

<div class="container">
  <button class="refresh-btn" onclick="loadAll()">🔄 Refresh</button>
  <h2>Overview</h2>
  <div id="stats" class="stats-grid"><div class="loading">Loading...</div></div>
  <div class="history-section">
    <h3>🧾 Recent Sales</h3>
    <div id="salesHistory"><div class="loading">Loading...</div></div>
  </div>
  <div class="history-section">
    <h3>📦 Recent Purchases</h3>
    <div id="purchasesHistory"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
  // ⚠️ මෙතන ඔබේ Google Apps Script Web App URL එක paste කරන්න
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyrB-cs8a2X-7NMkwE1MjTdjbI-wVMGMWM8r4NqjyNM6HW8I28Eh9Kz2wY3XEP5D78avw/exec';
  
  function fmt(n){ return 'Rs. ' + Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  
  async function api(action, extra={}) {
    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action, ...extra }),
      headers: {'Content-Type':'text/plain;charset=utf-8'}
    });
    return res.json();
  }
  
  async function loadAll() {
    document.getElementById('stats').innerHTML = '<div class="loading">Loading...</div>';
    try {
      const stats = await api('getDashboardStats');
      if (stats.success) renderStats(stats.data);
      
      const sales = await api('getSales');
      if (sales.success) renderSalesHistory(sales.data);
      
      const purchases = await api('getPurchases');
      if (purchases.success) renderPurchasesHistory(purchases.data);
    } catch(e) {
      document.getElementById('stats').innerHTML = '<div class="loading">Error: '+e+'</div>';
    }
  }
  
  function renderStats(s) {
    const cards = [
      { label:"Today's Sales", value:fmt(s.todaySales), cls:'green', icon:'💰' },
      { label:"Today's Purchases", value:fmt(s.todayPurchases), cls:'orange', icon:'🛒' },
      { label:"Total Sales", value:fmt(s.totalSales), cls:'blue', icon:'📈' },
      { label:"Total Purchases", value:fmt(s.totalPurchases), cls:'red', icon:'📉' },
      { label:"Profit", value:fmt(s.profit), cls:s.profit>=0?'green':'red', icon:'💵' },
      { label:"Today's Profit", value:fmt(s.todayProfit), cls:s.todayProfit>=0?'green':'red', icon:'✨' }
    ];
    document.getElementById('stats').innerHTML = cards.map(c=>`
      <div class="stat-card ${c.cls}">
        <div class="stat-icon">${c.icon}</div>
        <div class="stat-label">${c.label}</div>
        <div class="stat-value">${c.value}</div>
      </div>`).join('');
  }
  
  function renderSalesHistory(data) {
    const el = document.getElementById('salesHistory');
    if (!data || !data.length) { el.innerHTML = '<div class="empty">No sales yet</div>'; return; }
    const recent = data.slice(-10).reverse();
    let html = '<table><tr><th>Date</th><th>Product</th><th>Qty</th><th>Total</th><th>Customer</th><th>Location</th></tr>';
    recent.forEach(s=>{
      html += `<tr><td>${s.dateTime||''}</td><td>${s.productName||''}</td><td>${s.quantity||0}</td><td>${fmt(s.totalAmount)}</td><td>${s.customerName||'-'}</td><td>${s.location||'-'}</td></tr>`;
    });
    el.innerHTML = html + '</table>';
  }
  
  function renderPurchasesHistory(data) {
    const el = document.getElementById('purchasesHistory');
    if (!data || !data.length) { el.innerHTML = '<div class="empty">No purchases yet</div>'; return; }
    const recent = data.slice(-10).reverse();
    let html = '<table><tr><th>Date</th><th>Payment</th><th>Item</th><th>Total</th></tr>';
    recent.forEach(p=>{
      html += `<tr><td>${p.dateTime||''}</td><td>${p.paymentType||''}</td><td>${p.itemName||''}</td><td>${fmt(p.totalAmount)}</td></tr>`;
    });
    el.innerHTML = html + '</table>';
  }
  
  loadAll();
  setInterval(loadAll, 60000);
</script>
</body>
</html>
